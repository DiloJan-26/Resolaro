[project]
name = "resolaro-api"
version = "0.1.0"
description = "Resolaro API foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.18,<1.19",
    "fastapi>=0.142,<0.143",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
